name: K3s runner pilot

on:
  pull_request:
    branches: [codex/k3s-runner-fleet-sample-base]
    paths: [examples/k3s-runner/check.sh]

permissions:
  contents: read

jobs:
  smoke:
    name: Run Bazel and an ARM64 program on a pilot runner
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, debian-trixie-k3s-fleet-pilot]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the pilot runner
        run: bash examples/k3s-runner/check.sh
