name: DASH AMD64 on one 6 GiB production runner

on: workflow_dispatch

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare the registry HTTP audit agent
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile the same audit agent used by the full registry workflow
        run: python3 ci/build_http_audit.py --output "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar"
      - name: Publish the agent for this run
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-http-audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/debian-http-audit/debian-http-audit.jar
          if-no-files-found: error
          retention-days: 30

  dash:
    name: Build all four DASH outputs and run both registered tests on AMD64
    needs: prepare
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-dash
      version: 0.0.3-2cbfdfa1205c0d03003444e5c80f89adb8c3df59
      architecture: amd64
      execution_architecture: amd64
      cross_compile: false
      emulated_arm: false
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
      http_audit_artifact_id: ${{ needs.prepare.outputs.artifact_id }}
    secrets:
      DEBIAN_MIRROR_ROOT: ${{ secrets.DEBIAN_MIRROR_ROOT }}
      DEBIAN_SECURITY_MIRROR_ROOT: ${{ secrets.DEBIAN_SECURITY_MIRROR_ROOT }}
