name: Registry CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_versions:
        description: Test every configured historical version instead of only the latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan module validation
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select module versions
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL_VERSIONS: ${{ inputs.all_versions }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          POLICY_FLAGS=()
          if [[ "$EVENT_NAME" == push ]]; then
            # main already contains this push. Comparing with current main
            # would silently bless edits/deletions of published entries.
            PUBLISHED_SHA="$BEFORE_SHA"
            POLICY_FLAGS+=(--push)
          else
            # Use the maintained repository, including for forks and stacked
            # PRs. Anonymous public fetch needs no write token or credentials.
            git fetch --no-tags https://github.com/securely1g/sonic-bazel-registry.git \
              +refs/heads/main:refs/registry-ci/published-main
            PUBLISHED_SHA="$(git rev-parse refs/registry-ci/published-main)"
          fi
          printf 'Event: %s\nPublished baseline: %s\nPR base: %s\nHead: %s\n' \
            "$EVENT_NAME" "$PUBLISHED_SHA" "$BASE_SHA" "$HEAD_SHA" | tee plan.log
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --base "$BASE_SHA" --head "$HEAD_SHA" --output plan.json 2>&1 | tee -a plan.log
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$ALL_VERSIONS" == true ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --head "$HEAD_SHA" --all --output plan.json 2>&1 | tee -a plan.log
          else
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              "${POLICY_FLAGS[@]}" --head "$HEAD_SHA" --latest --output plan.json 2>&1 | tee -a plan.log
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          matrix = json.loads(Path("plan.json").read_text())
          if (os.environ["EVENT_NAME"] == "pull_request"
                  and os.environ["HEAD_REF"] == "codex/pigz-source-mirror"
                  and os.environ["HEAD_REPOSITORY"] == "securely1g/sonic-bazel-registry"):
              allowed = {".github/workflows/registry-ci.yml", "ci/registry_ci.py",
                         "ci/source_mirrors.cfg", "ci/tests/test_source_mirrors.py",
                         "ci/README.md", "ci/tests/test_registry_ci.py"}
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]],
                  text=True).splitlines())
              if not changed or not changed <= allowed:
                  raise SystemExit("Source-mirror test scope rejects unexpected files: " + repr(changed - allowed))
              print("Source-mirror CI fix: retain policy plan; run native runner and cold-fetch tests only.")
              matrix = {"include": []}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
              print("has_jobs=" + str(bool(matrix["include"])).lower(), file=output)
          PY
      - name: Retain validation plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-plan
          path: |
            plan.json
            plan.log
          if-no-files-found: warn
          retention-days: 14

  unit:
    name: Registry runner tests
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Bazel and ARM64 runtime for integration tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          printf '%s  %s\n' 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e \
            /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
          test -x /usr/local/bin/sonic-arm64
          echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          echo "REGISTRY_CI_TEST_ARM_EXECUTOR=/usr/local/bin/sonic-arm64" >> "$GITHUB_ENV"
      - name: Test planning and validation runner
        shell: bash
        env:
          REGISTRY_CI_TEST_ARTIFACTS: runner-bazel-artifacts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/tests -v 2>&1 | tee runner-tests.log
      - name: Retain runner test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-runner-tests
          path: |
            runner-tests.log
            runner-bazel-artifacts/
          if-no-files-found: warn
          retention-days: 14

  modules:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      # Keep the shared host's memory pressure bounded while retaining spare
      # ephemeral runners for planning, unit tests and subsequent jobs.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Both targets use native AMD64 build tools in the disposable worker.
    # ARM64 binaries and tests execute through its bundled QEMU runtime.
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_MODULE: ${{ matrix.module }}
      CI_VERSION: ${{ matrix.version }}
      CI_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify native Bazel 8.5.1
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          [[ "$CI_ARCHITECTURE" == amd64 || "$CI_ARCHITECTURE" == arm64 ]]
          printf '%s  %s\n' 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e \
            /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
      - name: Build and test through the registry
        run: |
          set -euo pipefail
          TEST_CONTAINER_IMAGE="${SONIC_RUNNER_IMAGE_REFERENCE:?Missing runner image identity}"
          CROSS_ARGS=()
          if [[ "$CI_ARCHITECTURE" == arm64 ]]; then
            CROSS_ARGS=(--cross-compile --test-executor /usr/local/bin/sonic-arm64)
          fi
          sudo -n git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -n python3 ci/registry_ci.py run \
            --module "$CI_MODULE" \
            --version "$CI_VERSION" \
            --architecture "$CI_ARCHITECTURE" \
            --bazel /usr/local/bin/bazel \
            --bazel-startup-arg=--host_jvm_args=-Xmx2g \
            --bazel-build-arg=--jobs=1 \
            --bazel-build-arg=--discard_analysis_cache \
            "${CROSS_ARGS[@]}" \
            --work-dir "$RUNNER_TEMP/registry-ci" \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts" \
            --test-container-image "$TEST_CONTAINER_IMAGE"
      - name: Archive module validation results
        id: archive
        if: always()
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/registry-ci-evidence.tar"
          sudo -n bash ci/archive_artifacts.sh "$GITHUB_WORKSPACE/ci-artifacts" "$archive"
          if [[ -f "$archive" ]]; then
            # Keep permissions inside the TAR intact while letting the
            # non-root upload action read the root-created archive.
            sudo -n chown "$(id -u):$(id -g)" "$archive"
          fi
      - name: Retain module validation results
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-${{ matrix.module }}-${{ matrix.version }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/registry-ci-evidence.tar
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Registry CI
    if: always()
    needs: [plan, unit, modules]
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - name: Require successful planning, runner tests, and module validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          MODULE_RESULT: ${{ needs.modules.result }}
          HAS_JOBS: ${{ needs.plan.outputs.has_jobs }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success ]]
          [[ "$UNIT_RESULT" == success ]]
          if [[ "$HAS_JOBS" == true ]]; then
            [[ "$MODULE_RESULT" == success ]]
          else
            [[ "$HAS_JOBS" == false && "$MODULE_RESULT" == skipped ]]
          fi
