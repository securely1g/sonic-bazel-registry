name: Pinned Debian ARM module validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-download-sonic-swss-common-${{ github.ref }}
  cancel-in-progress: false

jobs:
  module_arm64:
    name: sonic-swss-common 0.0.9-334389eae54afd1f4f5ee69f89c3a7ad2062ee61 (ARM64 cross, full 16-build/24-test contract)
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-swss-common
      version: 0.0.9-334389eae54afd1f4f5ee69f89c3a7ad2062ee61
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
