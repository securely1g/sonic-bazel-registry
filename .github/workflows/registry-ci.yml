name: Sairedis original ARM runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sairedis:
    name: Sairedis original ARM contract
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-sairedis
      version: 0.0.5-a1568983582654314c43aab421b32ab563ed860c
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
