name: Run the full ARM64 registry suite with the Bazel HTTP test fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Select the production K3s runner pool
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    outputs:
      fleet_validation: ${{ steps.select.outputs.fleet_validation }}
    steps:
      - id: select
        run: echo "fleet_validation=true" >> "$GITHUB_OUTPUT"

  unit:
    name: Registry runner tests (${{ matrix.architecture }})
    env:
      PILOT_EMULATED_ARM: ${{ needs.plan.outputs.fleet_validation == 'true' && matrix.architecture == 'arm64' }}
    needs: plan
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            timeout_minutes: 30
            runner: [ubuntu-24.04-arm]
            machine: aarch64
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ needs.plan.outputs.fleet_validation == 'true' && fromJSON('["self-hosted","Linux","X64","debian-trixie-container"]') || matrix.runner }}
    timeout-minutes: ${{ needs.plan.outputs.fleet_validation == 'true' && matrix.architecture == 'arm64' && 180 || matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 2dc5cf7ad0ff3ff417809435c6478c1a49114466
          persist-credentials: false
      - name: Identify the checked-out mirror configuration
        id: mirror_config
        if: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && hashFiles('ci/private_mirrors.py') != '' }}
        run: echo "kind=${{ hashFiles('ci/debian_snapshots.json') != '' && 'roots' || 'dated' }}" >> "$GITHUB_OUTPUT"
      - name: Download the optional same-run HTTP audit agent
        id: http_audit_download
        if: ${{ needs.plan.outputs.http_audit_artifact_id != '' && contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.plan.outputs.http_audit_artifact_id }}
          path: ${{ runner.temp }}/debian-http-audit
          merge-multiple: true
      - name: Prepare the ARM64 build environment on the pilot worker
        if: needs.plan.outputs.fleet_validation == 'true' && matrix.architecture == 'arm64'
        run: ci/pilot_arm.sh prepare
      - name: Prepare APT repository tools
        shell: &unit_shell bash ci/pilot_arm.sh shell {0}
        run: bash ci/prepare_repository_tools.sh
      - name: Install Bazel for real runner integration tests
        shell: *unit_shell
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          BAZEL_ARCH: ${{ matrix.bazel_arch }}
          BAZEL_SHA: ${{ matrix.bazel_sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
          if [[ "$BAZEL_ARCH" == x86_64 ]]; then
            printf '%s  %s\n' "$BAZEL_SHA" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
            # The image wrapper passes its Java CA store as a startup option,
            # including when tests use --ignore_all_rc_files.
            echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          elif [[ "${PILOT_EMULATED_ARM:-false}" == true ]]; then
            printf '%s  %s\n' "$BAZEL_SHA" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
            echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          else
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/bazel-8.5.1" \
              "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${BAZEL_ARCH}"
            printf '%s  %s\n' "$BAZEL_SHA" "$RUNNER_TEMP/bazel-8.5.1" | sha256sum --check --strict
            chmod 0755 "$RUNNER_TEMP/bazel-8.5.1"
            echo "REGISTRY_CI_TEST_BAZEL=$RUNNER_TEMP/bazel-8.5.1" >> "$GITHUB_ENV"
          fi
      - name: Test planning and validation runner
        shell: *unit_shell
        env:
          REGISTRY_CI_EMULATED_ARM: ${{ needs.plan.outputs.fleet_validation == 'true' && matrix.architecture == 'arm64' }}
          REGISTRY_CI_TEST_ARTIFACTS: runner-ci-artifacts/runner-bazel-artifacts
          HTTP_AUDIT_READY: ${{ steps.http_audit_download.outcome }}
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          unset PILOT_EMULATED_ARM
          mkdir -p runner-ci-artifacts
          HTTP_AUDIT_ARGS=()
          if [[ "${HTTP_AUDIT_READY:-}" == success ]]; then
            HTTP_AUDIT_ARGS=(--http-audit-jar "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar")
          fi
          python3 ci/private_mirrors.py suite \
            --artifacts runner-ci-artifacts --private-dir "$RUNNER_TEMP/private-mirrors-unit" \
            --public-config ci/source_mirrors.cfg "${HTTP_AUDIT_ARGS[@]}" \
            -- python3 ci/run_runner_tests.py --suite native
      - name: Give the runner access to the ARM guest test evidence
        if: ${{ always() && needs.plan.outputs.fleet_validation == 'true' && matrix.architecture == 'arm64' }}
        run: |
          if [[ -d runner-ci-artifacts ]]; then
            sudo -n chown -R "$(id -u):$(id -g)" runner-ci-artifacts
          fi
      - name: Validate private Debian mirrors from the Trixie runner
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.private_mirror_probe && contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && github.actor != 'dependabot[bot]' }}
        shell: bash
        env:
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/runner-ci-artifacts/private-mirror-probe"
          python3 ci/private_mirrors.py probe \
            --artifacts "$GITHUB_WORKSPACE/runner-ci-artifacts/private-mirror-probe" \
            --private-dir "$RUNNER_TEMP/private-mirrors-unit" \
            --public-config ci/source_mirrors.cfg \
            --bazel /usr/local/bin/bazel
      - name: Check runner evidence for private mirror URLs
        id: privacy
        if: always()
        shell: bash
        env:
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          python3 ci/private_mirrors.py check-artifacts --artifacts "$GITHUB_WORKSPACE/runner-ci-artifacts"
      - name: Retain runner test results
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-runner-tests-${{ matrix.architecture }}
          path: runner-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
