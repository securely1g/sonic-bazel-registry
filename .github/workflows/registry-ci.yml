name: Validate P4C execution-platform generators
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/registry-module.yml
    with:
      module: p4c
      version: 1.2.4.2.sonic.3
      architecture: amd64
      execution_architecture: amd64
      cross_compile: false
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
