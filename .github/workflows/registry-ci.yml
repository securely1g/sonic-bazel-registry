name: Validate the rules_distroless ARM kernel test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/registry-module.yml
    with:
      module: rules_distroless
      version: 0.9.4.sonic.17
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
