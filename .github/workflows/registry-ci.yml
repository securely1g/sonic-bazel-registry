name: Validate DASH with cross-compilable PI and P4C
on: workflow_dispatch
permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.candidate.module }} (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        architecture: [arm64]
        candidate:
          - {module: sonic-dash, version: "0.0.3-5c9305403585a7ae54f86918219acb8ed39f740a"}
    uses: ./.github/workflows/registry-module.yml
    with:
      module: ${{ matrix.candidate.module }}
      version: ${{ matrix.candidate.version }}
      architecture: ${{ matrix.architecture }}
      execution_architecture: amd64
      cross_compile: ${{ matrix.architecture == 'arm64' }}
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
