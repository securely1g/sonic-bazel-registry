name: Qualify merged SONiC FIPS 0.0.6
run-name: FIPS 0.0.6 (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution and target architecture
        type: choice
        options: [cross-arm64, native-arm64, native-amd64]
        default: cross-arm64
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-fips
      version: 0.0.6-1ea828e13ac9c62d2007dbbf2ef3d72417e3d009
      architecture: ${{ inputs.mode == 'native-amd64' && 'amd64' || 'arm64' }}
      execution_architecture: ${{ inputs.mode == 'native-arm64' && 'arm64' || 'amd64' }}
      cross_compile: ${{ inputs.mode == 'cross-arm64' }}
      runner: ${{ inputs.mode == 'native-arm64' && '"ubuntu-24.04-arm"' || '["self-hosted","Linux","X64","debian-trixie-container"]' }}
