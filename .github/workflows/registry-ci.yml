name: SWSS original ARM runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swss:
    name: SWSS original ARM contract
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-swss
      version: 0.0.1-88d9cc2bcda39b0ebac16c95de9601e62021e3eb
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
