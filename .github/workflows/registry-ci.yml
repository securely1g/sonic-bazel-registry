name: Registry CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_versions:
        description: Test every configured historical version instead of only the latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan module validation
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      amd64_matrix: ${{ steps.plan.outputs.amd64_matrix }}
      has_amd64_jobs: ${{ steps.plan.outputs.has_amd64_jobs }}
      arm64_matrix: ${{ steps.plan.outputs.arm64_matrix }}
      has_arm64_jobs: ${{ steps.plan.outputs.has_arm64_jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select module versions
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL_VERSIONS: ${{ inputs.all_versions }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          POLICY_FLAGS=()
          if [[ "$EVENT_NAME" == push ]]; then
            # main already contains this push. Comparing with current main
            # would silently bless edits/deletions of published entries.
            PUBLISHED_SHA="$BEFORE_SHA"
            POLICY_FLAGS+=(--push)
          else
            # Use the maintained repository, including for forks and stacked
            # PRs. Anonymous public fetch needs no write token or credentials.
            git fetch --no-tags https://github.com/securely1g/sonic-bazel-registry.git \
              +refs/heads/main:refs/registry-ci/published-main
            PUBLISHED_SHA="$(git rev-parse refs/registry-ci/published-main)"
          fi
          printf 'Event: %s\nPublished baseline: %s\nPR base: %s\nHead: %s\n' \
            "$EVENT_NAME" "$PUBLISHED_SHA" "$BASE_SHA" "$HEAD_SHA" | tee plan.log
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --base "$BASE_SHA" --head "$HEAD_SHA" --output plan.json 2>&1 | tee -a plan.log
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$ALL_VERSIONS" == true ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --head "$HEAD_SHA" --all --output plan.json 2>&1 | tee -a plan.log
          else
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              "${POLICY_FLAGS[@]}" --head "$HEAD_SHA" --latest --output plan.json 2>&1 | tee -a plan.log
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          matrix = json.loads(Path("plan.json").read_text())
          if (os.environ["EVENT_NAME"] == "pull_request"
                  and os.environ["HEAD_REF"] == "codex/registry-bep-unicode"
                  and os.environ["HEAD_REPOSITORY"] == "securely1g/sonic-bazel-registry"):
              # Temporary Draft scope: policy planning and both runner suites
              # still run. Remove this guard before marking the PR Ready.
              allowed = {".github/workflows/registry-ci.yml", "ci/registry_ci.py",
                         "ci/tests/test_artifact_preservation.py", "ci/tests/test_bazel_artifacts.py",
                         "ci/README.md"}
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]],
                  text=True).splitlines())
              if not changed or not changed <= allowed:
                  raise SystemExit("BEP Unicode scope rejects unexpected files: " + repr(changed - allowed))
              print("Draft BEP Unicode repair: retain policy plan and both runner suites; no module jobs.")
              matrix = {"include": []}
          if (os.environ["EVENT_NAME"] == "pull_request"
                  and os.environ["HEAD_REF"] == "codex/registry-module-downloader"
                  and os.environ["HEAD_REPOSITORY"] == "securely1g/sonic-bazel-registry"):
              # Temporary Draft scope: retain policy planning and both runner
              # suites; defer the broader native module matrix until Ready.
              allowed = {".github/workflows/registry-ci.yml", ".github/workflows/registry-module.yml",
                         "ci/tests/test_registry_ci.py", "ci/tests/fixtures/source_mirrors_7322bd.cfg",
                         "ci/README.md"}
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]],
                  text=True).splitlines())
              if not changed or not changed <= allowed:
                  raise SystemExit("Module downloader scope rejects unexpected files: " + repr(changed - allowed))
              print("Draft module downloader integration: retain policy plan and both runner suites; no module jobs.")
              matrix = {"include": []}
          architectures = ("amd64", "arm64")
          if any(job["architecture"] not in architectures for job in matrix["include"]):
              raise SystemExit("Unsupported architecture in validation plan")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
              print("has_jobs=" + str(bool(matrix["include"])).lower(), file=output)
              for architecture in architectures:
                  selected = {"include": [job for job in matrix["include"]
                                          if job["architecture"] == architecture]}
                  print(architecture + "_matrix=" + json.dumps(selected, separators=(",", ":")), file=output)
                  print("has_" + architecture + "_jobs=" + str(bool(selected["include"])).lower(), file=output)
          PY
      - name: Retain validation plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-plan
          path: |
            plan.json
            plan.log
          if-no-files-found: warn
          retention-days: 14

  unit:
    name: Registry runner tests (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: [self-hosted, Linux, X64, debian-trixie-container]
            machine: x86_64
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            runner: [ubuntu-24.04-arm]
            machine: aarch64
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Bazel for real runner integration tests
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          BAZEL_ARCH: ${{ matrix.bazel_arch }}
          BAZEL_SHA: ${{ matrix.bazel_sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
          if [[ "$BAZEL_ARCH" == x86_64 ]]; then
            printf '%s  %s\n' "$BAZEL_SHA" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
            # The image wrapper passes its Java CA store as a startup option,
            # including when tests use --ignore_all_rc_files.
            echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          else
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/bazel-8.5.1" \
              "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${BAZEL_ARCH}"
            printf '%s  %s\n' "$BAZEL_SHA" "$RUNNER_TEMP/bazel-8.5.1" | sha256sum --check --strict
            chmod 0755 "$RUNNER_TEMP/bazel-8.5.1"
            echo "REGISTRY_CI_TEST_BAZEL=$RUNNER_TEMP/bazel-8.5.1" >> "$GITHUB_ENV"
          fi
      - name: Test planning and validation runner
        shell: bash
        env:
          REGISTRY_CI_TEST_ARTIFACTS: runner-bazel-artifacts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/tests -v 2>&1 | tee runner-tests.log
      - name: Retain runner test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-runner-tests-${{ matrix.architecture }}
          path: |
            runner-tests.log
            runner-bazel-artifacts/
          if-no-files-found: warn
          retention-days: 14

  modules_amd64:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.has_amd64_jobs == 'true'
    strategy:
      fail-fast: false
      # Only local compiler jobs share the host memory budget.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.amd64_matrix) }}
    uses: ./.github/workflows/registry-module.yml
    with:
      module: ${{ matrix.module }}
      version: ${{ matrix.version }}
      architecture: ${{ matrix.architecture }}
      runner: ${{ toJSON(matrix.runner) }}

  modules_arm64:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.has_arm64_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.arm64_matrix) }}
    uses: ./.github/workflows/registry-module.yml
    with:
      module: ${{ matrix.module }}
      version: ${{ matrix.version }}
      architecture: ${{ matrix.architecture }}
      runner: ${{ toJSON(matrix.runner) }}

  required:
    name: Registry CI
    if: always()
    needs: [plan, unit, modules_amd64, modules_arm64]
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - name: Require successful planning, runner tests, and module validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          AMD64_RESULT: ${{ needs.modules_amd64.result }}
          ARM64_RESULT: ${{ needs.modules_arm64.result }}
          HAS_AMD64_JOBS: ${{ needs.plan.outputs.has_amd64_jobs }}
          HAS_ARM64_JOBS: ${{ needs.plan.outputs.has_arm64_jobs }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success ]]
          [[ "$UNIT_RESULT" == success ]]
          require_modules() {
            if [[ "$1" == true ]]; then
              [[ "$2" == success ]]
            else
              [[ "$1" == false && "$2" == skipped ]]
            fi
          }
          require_modules "$HAS_AMD64_JOBS" "$AMD64_RESULT"
          require_modules "$HAS_ARM64_JOBS" "$ARM64_RESULT"
