name: Libyang native-preparation ARM cross acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libyang-7-cross-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pty_regression:
    name: PTY and prepared-runtime regressions
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run original terminal and prepared-runtime cases
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B modules/libyang/3.12.2.sonic.7/tests/pty_wait_test.py \
            --output "$RUNNER_TEMP/libyang-pty-regression"
          /usr/bin/python3 -I -S -B modules/libyang/3.12.2.sonic.7/tests/prepared_runtime_test.py -v \
            2>&1 | tee "$RUNNER_TEMP/libyang-pty-regression/prepared-runtime.log"
      - name: Retain exact terminal regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libyang-7-pty-regression
          path: ${{ runner.temp }}/libyang-pty-regression
          if-no-files-found: error
          retention-days: 14

  libyang_arm64:
    name: libyang 3.12.2.sonic.7 (ARM64 cross, full 7-build/5-test contract)
    needs: pty_regression
    uses: ./.github/workflows/registry-module.yml
    with:
      module: libyang
      version: 3.12.2.sonic.7
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
