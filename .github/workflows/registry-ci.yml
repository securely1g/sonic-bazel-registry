name: Registry CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_versions:
        description: Test every configured historical version instead of only the latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan module validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select module versions
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL_VERSIONS: ${{ inputs.all_versions }}
        run: |
          set -euo pipefail
          POLICY_FLAGS=()
          if [[ "$EVENT_NAME" == push ]]; then
            # main already contains this push. Comparing with current main
            # would silently bless edits/deletions of published entries.
            PUBLISHED_SHA="$BEFORE_SHA"
            POLICY_FLAGS+=(--push)
          else
            # Use the maintained repository, including for forks and stacked
            # PRs. Anonymous public fetch needs no write token or credentials.
            git fetch --no-tags https://github.com/securely1g/sonic-bazel-registry.git \
              +refs/heads/main:refs/registry-ci/published-main
            PUBLISHED_SHA="$(git rev-parse refs/registry-ci/published-main)"
          fi
          printf 'Event: %s\nPublished baseline: %s\nPR base: %s\nHead: %s\n' \
            "$EVENT_NAME" "$PUBLISHED_SHA" "$BASE_SHA" "$HEAD_SHA" | tee plan.log
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --base "$BASE_SHA" --head "$HEAD_SHA" --output plan.json 2>&1 | tee -a plan.log
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$ALL_VERSIONS" == true ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --head "$HEAD_SHA" --all --output plan.json 2>&1 | tee -a plan.log
          else
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              "${POLICY_FLAGS[@]}" --head "$HEAD_SHA" --latest --output plan.json 2>&1 | tee -a plan.log
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path("plan.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
              print("has_jobs=" + str(bool(matrix["include"])).lower(), file=output)
          PY
      - name: Retain validation plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-plan
          path: |
            plan.json
            plan.log
          if-no-files-found: warn
          retention-days: 14

  unit:
    name: Registry runner tests (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Bazel for the real artifact collector test
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          BAZEL_ARCH: ${{ matrix.bazel_arch }}
          BAZEL_SHA: ${{ matrix.bazel_sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bazel-8.5.1" \
            "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${BAZEL_ARCH}"
          printf '%s  %s\n' "$BAZEL_SHA" "$RUNNER_TEMP/bazel-8.5.1" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/bazel-8.5.1"
          echo "REGISTRY_CI_TEST_BAZEL=$RUNNER_TEMP/bazel-8.5.1" >> "$GITHUB_ENV"
      - name: Test planning and validation runner
        shell: bash
        env:
          REGISTRY_CI_TEST_ARTIFACTS: runner-bazel-artifacts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/tests -v 2>&1 | tee runner-tests.log
      - name: Retain runner test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-runner-tests-${{ matrix.architecture }}
          path: |
            runner-tests.log
            runner-bazel-artifacts/
          if-no-files-found: warn
          retention-days: 14

  modules:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_MODULE: ${{ matrix.module }}
      CI_VERSION: ${{ matrix.version }}
      CI_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Install build and package test tools
        run: |
          set -euo pipefail
          apt-get update
          # LLVM needs libxml2; installed SDK tests exercise their pkg-config metadata.
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl gdb git libxml2 libzstd-dev patch pkg-config python3 tar unzip xz-utils zlib1g-dev zstd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Bazel 8.5.1
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              [[ "$CI_ARCHITECTURE" == amd64 ]]
              bazel_arch=x86_64
              bazel_sha=61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
              ;;
            aarch64)
              [[ "$CI_ARCHITECTURE" == arm64 ]]
              bazel_arch=arm64
              bazel_sha=b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
              ;;
            *) echo "Unsupported native architecture" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 --output /tmp/bazel "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${bazel_arch}"
          printf '%s  %s\n' "$bazel_sha" /tmp/bazel | sha256sum --check --strict
          install -m 0755 /tmp/bazel /usr/local/bin/bazel
      # Temporary Draft-only prerequisite catalog. Remove after #146/#147 land.
      - name: Stage reviewed native libnl3 prerequisites
        if: matrix.module == 'libnl3' && matrix.version == '3.7.0.sonic.7'
        run: |
          set -euo pipefail
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --no-tags https://github.com/securely1g/sonic-bazel-registry.git 88b921106d3c5097204752a38be6c6b29bad2399
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = 88b921106d3c5097204752a38be6c6b29bad2399
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import subprocess

          git = ["git", "-c", "safe.directory=" + str(Path.cwd().resolve())]
          revision = "88b921106d3c5097204752a38be6c6b29bad2399"
          expected = {'modules/rules_distroless/0.9.4.sonic.13': 'f449be186aaa231a7278a773452b22cb4fed9e86', 'modules/sonic-build-infra/0.0.25-917c7d5792f88c9de485ea5172a835bb0c06bf6a': 'fe334da888bfb181c339c0d391c6aa83163c3914'}
          for path, tree in expected.items():
              actual = subprocess.check_output(git + ["rev-parse", revision + ":" + path], text=True).strip()
              if actual != tree:
                  raise SystemExit("Draft prerequisite tree mismatch: " + path)
          # Restore only prerequisite recipes; the PR's own candidate stays under test.
          subprocess.run(git + ["restore", "--source=" + revision, "--worktree", "--", *expected], check=True)
          output = Path("ci-artifacts")
          output.mkdir(exist_ok=True)
          (output / "draft-prerequisites.json").write_text(json.dumps({"registry_commit": revision, "entry_trees": expected}, indent=2) + "\n")
          PYTHON
      - name: Build and test through the registry
        run: |
          set -euo pipefail
          python3 ci/registry_ci.py run \
            --module "$CI_MODULE" \
            --version "$CI_VERSION" \
            --architecture "$CI_ARCHITECTURE" \
            --work-dir "$RUNNER_TEMP/registry-ci" \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts" \
            --test-container-image debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      - name: Check installed libnl3 SDK and runtime
        if: matrix.module == 'libnl3' && matrix.version == '3.7.0.sonic.7'
        run: |
          set -euo pipefail
          python3 modules/libnl3/3.7.0.sonic.7/tests/installed_sdk_test.py \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts" 2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/libnl3-installed-sdk.log"
      - name: Check installed libnl3 debug symbols
        if: matrix.module == 'libnl3' && matrix.version == '3.7.0.sonic.7'
        run: |
          set -euo pipefail
          python3 modules/libnl3/3.7.0.sonic.7/tests/installed_debug_test.py \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts" 2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/libnl3-installed-debug.log"
      - name: Archive module validation results
        id: archive
        if: always()
        run: bash ci/archive_artifacts.sh "$GITHUB_WORKSPACE/ci-artifacts" "$RUNNER_TEMP/registry-ci-evidence.tar"
      - name: Retain module validation results
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-${{ matrix.module }}-${{ matrix.version }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/registry-ci-evidence.tar
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Registry CI
    if: always()
    needs: [plan, unit, modules]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful planning, runner tests, and module validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          MODULE_RESULT: ${{ needs.modules.result }}
          HAS_JOBS: ${{ needs.plan.outputs.has_jobs }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success ]]
          [[ "$UNIT_RESULT" == success ]]
          if [[ "$HAS_JOBS" == true ]]; then
            [[ "$MODULE_RESULT" == success ]]
          else
            [[ "$HAS_JOBS" == false && "$MODULE_RESULT" == skipped ]]
          fi
