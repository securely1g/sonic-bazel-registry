name: Validate iproute2's two original ARM tests with guest Linux exec semantics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/registry-module.yml
    with:
      module: iproute2
      version: 6.15.0.sonic.7
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
