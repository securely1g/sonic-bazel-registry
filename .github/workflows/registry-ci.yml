name: Check the socat cross-build and sflowtool configure log
on: workflow_dispatch

permissions:
  contents: read

jobs:
  socat:
    name: Fleet arm-cross / socat 1.8.0.2.sonic.6 (arm64)
    uses: ./.github/workflows/registry-module.yml
    with:
      module: "socat"
      version: "1.8.0.2.sonic.6"
      architecture: "arm64"
      execution_architecture: "amd64"
      cross_compile: true
      emulated_arm: false
      supplemental_case: arm-cross
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
  sflowtool:
    name: Fleet legacy-output / sflowtool 6.11.0.sonic.2 (amd64)
    uses: ./.github/workflows/registry-module.yml
    with:
      module: "sflowtool"
      version: "6.11.0.sonic.2"
      architecture: "amd64"
      execution_architecture: "amd64"
      cross_compile: false
      emulated_arm: false
      supplemental_case: legacy-output
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
