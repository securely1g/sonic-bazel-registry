name: SWSS 0.0.3 production ARM runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swss:
    name: SWSS 0.0.3 production ARM contract
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-swss
      version: 0.0.3-42df8c74af53427be97609a7b11e9aec59d2d454
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
