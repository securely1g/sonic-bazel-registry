name: Check the locked ARM64 Debian source
on: workflow_dispatch
permissions: {}
jobs:
  download:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Look up the original binary in Debian Snapshot
        shell: python
        run: |
          import concurrent.futures
          import hashlib
          import json
          from urllib.request import urlopen

          expected = "2e791f8faf7bbbc94d354cf7b6c3728dc303b7aa327dfe7a2aa6954320977c8f"
          size = 198880
          fname = "libmount1_2.41-5_arm64.deb"
          def discover(base):
              try:
                  url = base + "/mr/binary/libmount1/2.41-5/binfiles?fileinfo=1"
                  with urlopen(url, timeout=18) as response:
                      doc = json.load(response)
                  return [base + "/file/" + row["hash"] for row in doc["result"] if row["architecture"] == "arm64"]
              except Exception as err:
                  print(f"{base}: {err}", flush=True)
                  return []
          bases = ["https://snapshot.debian.org", "https://snapshot-cloudflare.debian.org"]
          with concurrent.futures.ThreadPoolExecutor() as executor:
              candidates = [url for group in executor.map(discover, bases) for url in group]
          candidates.extend(base + "/archive/debian/20250701T000000Z/pool/main/u/util-linux/" + fname for base in bases)
          def verify(url):
              try:
                  with urlopen(url, timeout=18) as response:
                      data = response.read(size + 1)
                  if len(data) == size and hashlib.sha256(data).hexdigest() == expected:
                      print(f"Verified {fname} from {url} for SHA256 {expected}, SHA1 {hashlib.sha1(data).hexdigest()}", flush=True)
                      return True
              except Exception as err:
                  print(f"{url}: {err}", flush=True)
              return False
          with concurrent.futures.ThreadPoolExecutor() as executor:
              matches = list(executor.map(verify, candidates))
          if not any(matches):
              raise SystemExit("Could not retrieve the locked bytes from a Debian source")
