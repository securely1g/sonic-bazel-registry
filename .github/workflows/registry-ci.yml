name: Rules Go combined prerequisite validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan module validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed modules
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/registry_ci.py plan --base "$BASE_SHA" --head "$HEAD_SHA" --output plan.json 2>&1 | tee plan.log
          else
            python3 ci/registry_ci.py plan --all --output all-plan.json 2>&1 | tee plan.log
            python3 -c 'import json; p=json.load(open("all-plan.json")); p["include"]=[j for j in p["include"] if j["module"] == "rules_go" and j["version"] == "0.64.1-sonic.1"]; assert len(p["include"]) == 2; json.dump(p, open("plan.json", "w"))'
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path("plan.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
              print("has_jobs=" + str(bool(matrix["include"])).lower(), file=output)
          PY
      - name: Retain validation plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-plan
          path: |
            plan.json
            all-plan.json
            plan.log
          if-no-files-found: warn
          retention-days: 14

  unit:
    name: Registry runner tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test planning and validation runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/tests -v 2>&1 | tee runner-tests.log
      - name: Retain runner test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-runner-tests
          path: runner-tests.log
          if-no-files-found: warn
          retention-days: 14

  modules:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_MODULE: ${{ matrix.module }}
      CI_VERSION: ${{ matrix.version }}
      CI_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Install build and package test tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git python3 tar curl xz-utils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Bazel 8.5.1
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              [[ "$CI_ARCHITECTURE" == amd64 ]]
              bazel_arch=x86_64
              bazel_sha=61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
              ;;
            aarch64)
              [[ "$CI_ARCHITECTURE" == arm64 ]]
              bazel_arch=arm64
              bazel_sha=b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
              ;;
            *) echo "Unsupported native architecture" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 --output /tmp/bazel "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${bazel_arch}"
          printf '%s  %s\n' "$bazel_sha" /tmp/bazel | sha256sum --check --strict
          install -m 0755 /tmp/bazel /usr/local/bin/bazel
      - name: Build and test through the registry
        run: |
          set -euo pipefail
          python3 ci/registry_ci.py run \
            --module "$CI_MODULE" \
            --version "$CI_VERSION" \
            --architecture "$CI_ARCHITECTURE" \
            --work-dir "$RUNNER_TEMP/registry-ci" \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts"
      - name: Record combined source and SDK evidence
        if: always()
        run: |
          mkdir -p ci-artifacts
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > ci-artifacts/combined-revision.txt
          uname -m > ci-artifacts/runner-architecture.txt
          bazel version > ci-artifacts/bazel-version.txt
          python3 - <<'PYRECEIPT'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "registry-ci/bazel"
          cgo = list(root.glob("*/external/rules_go+/go/private/rules/cgo.bzl"))
          sdks = list(root.glob("*/external/rules_go++go_sdk+*/VERSION"))
          receipt = {"cgo": {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in cgo},
                     "sdks": {str(p): p.read_text() for p in sdks}}
          Path("ci-artifacts/source-sdk-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          assert len(cgo) == 1 and receipt["cgo"][str(cgo[0])] == "5f7e9f6788a1ba8d57aa4752212d0fad390657b3cb3d40c2962886ae8fe28bd9"
          assert sdks and all(p.read_text().splitlines()[0] == "go1.26.7" for p in sdks)
          PYRECEIPT
      - name: Retain module validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-${{ matrix.module }}-${{ matrix.version }}-${{ matrix.architecture }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Registry CI
    if: always()
    needs: [plan, unit, modules]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful planning, runner tests, and module validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          MODULE_RESULT: ${{ needs.modules.result }}
          HAS_JOBS: ${{ needs.plan.outputs.has_jobs }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success ]]
          [[ "$UNIT_RESULT" == success ]]
          if [[ "$HAS_JOBS" == true ]]; then
            [[ "$MODULE_RESULT" == success ]]
          else
            [[ "$HAS_JOBS" == false && "$MODULE_RESULT" == skipped ]]
          fi
