name: Sairedis ARM64 runner memory check
on: workflow_dispatch

permissions:
  contents: read

jobs:
  sairedis:
    name: Build the Sairedis packages and run all seven tests
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-sairedis
      version: 0.0.5-ce101b2751e29205bcbea0f7a7b61e3062df7214
      architecture: arm64
      execution_architecture: arm64
      cross_compile: false
      emulated_arm: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
