name: Libyang native-preparation native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libyang-7-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  libyang_amd64:
    name: libyang 3.12.2.sonic.7 (native AMD64, full 7-build/5-test contract)
    uses: ./.github/workflows/registry-module.yml
    with:
      module: libyang
      version: 3.12.2.sonic.7
      architecture: amd64
      execution_architecture: amd64
      cross_compile: false
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'

  libyang_arm64:
    name: libyang 3.12.2.sonic.7 (native ARM64, full 7-build/5-test contract)
    uses: ./.github/workflows/registry-module.yml
    with:
      module: libyang
      version: 3.12.2.sonic.7
      architecture: arm64
      execution_architecture: arm64
      cross_compile: false
      runner: '["ubuntu-24.04-arm"]'
