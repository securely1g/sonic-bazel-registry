name: Validate the cold HTTP audit graph on native AMD64 and the ARM64 guest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Cold HTTP audit (${{ matrix.architecture }})
    env:
      PILOT_EMULATED_ARM: ${{ matrix.architecture == 'arm64' }}
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            timeout_minutes: 45
            runner: [self-hosted, Linux, X64, debian-trixie-container]
            machine: x86_64
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            timeout_minutes: 30
            runner: [ubuntu-24.04-arm]
            machine: aarch64
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3061014145cecfbd82c0fbcf5e4cbafe4405e785
          persist-credentials: false
      - name: Identify the checked-out mirror configuration
        id: mirror_config
        if: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && hashFiles('ci/private_mirrors.py') != '' }}
        run: echo "kind=${{ hashFiles('ci/debian_snapshots.json') != '' && 'roots' || 'dated' }}" >> "$GITHUB_OUTPUT"
      - name: Build the same maintained HTTP audit JAR supplied to the native job
        id: http_audit_download
        if: matrix.architecture == 'amd64'
        run: |
          mkdir -p "$RUNNER_TEMP/debian-http-audit"
          python3 ci/build_http_audit.py --output "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar"
      - name: Prepare the ARM64 build environment on the pilot worker
        if: matrix.architecture == 'arm64'
        run: ci/pilot_arm.sh prepare
      - name: Prepare APT repository tools
        shell: &unit_shell bash ci/pilot_arm.sh shell {0}
        run: bash ci/prepare_repository_tools.sh
      - name: Install Bazel for real runner integration tests
        shell: *unit_shell
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          BAZEL_ARCH: ${{ matrix.bazel_arch }}
          BAZEL_SHA: ${{ matrix.bazel_sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
          if [[ "$BAZEL_ARCH" == x86_64 ]]; then
            printf '%s  %s\n' "$BAZEL_SHA" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
            # The image wrapper passes its Java CA store as a startup option,
            # including when tests use --ignore_all_rc_files.
            echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          elif [[ "${PILOT_EMULATED_ARM:-false}" == true ]]; then
            printf '%s  %s\n' "$BAZEL_SHA" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
            echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          else
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/bazel-8.5.1" \
              "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${BAZEL_ARCH}"
            printf '%s  %s\n' "$BAZEL_SHA" "$RUNNER_TEMP/bazel-8.5.1" | sha256sum --check --strict
            chmod 0755 "$RUNNER_TEMP/bazel-8.5.1"
            echo "REGISTRY_CI_TEST_BAZEL=$RUNNER_TEMP/bazel-8.5.1" >> "$GITHUB_ENV"
          fi
      - name: Test planning and validation runner
        shell: *unit_shell
        env:
          REGISTRY_CI_EMULATED_ARM: ${{ matrix.architecture == 'arm64' }}
          REGISTRY_CI_TEST_ARTIFACTS: runner-ci-artifacts/runner-bazel-artifacts
          HTTP_AUDIT_READY: ${{ steps.http_audit_download.outcome }}
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          unset PILOT_EMULATED_ARM
          mkdir -p runner-ci-artifacts
          cat > "$RUNNER_TEMP/time-http-method.py" <<'DIAGNOSTIC'
          """Run one real unittest, recording only its Bazel operation, exit code and elapsed time."""
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import time
          import unittest
          from unittest.mock import patch

          candidate = "3061014145cecfbd82c0fbcf5e4cbafe4405e785"
          method = "test_real_bazel_opaque_fallback_redirect_integrity_and_cache"
          receipt = Path("runner-ci-artifacts/http-method.json")
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == candidate
          sys.path.insert(0, str(Path.cwd() / "ci/tests"))
          from test_debian_http_audit import DebianHttpAuditTest
          calls = []
          run = subprocess.run

          def timed_run(argv, *args, **kwargs):
              if "mod" in argv and "graph" in argv:
                  stage = (Path(kwargs["cwd"]) / "extension.bzl").read_text().splitlines()[-1].removeprefix("# ")
                  kind = "graph"
              elif "server_pid" in argv or "shutdown" in argv:
                  kind = "server_pid" if "server_pid" in argv else "shutdown"
                  stage = kind
              else:
                  return run(argv, *args, **kwargs)
              row = {"kind": kind, "stage": stage, "timeout": kwargs["timeout"], "started_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
              calls.append(row)
              start = time.monotonic()
              try:
                  result = run(argv, *args, **kwargs)
                  row["returncode"] = result.returncode
                  return result
              except Exception as exc:
                  row["error"] = type(exc).__name__
                  raise
              finally:
                  row["seconds"] = round(time.monotonic() - start, 3)
                  print("HTTP fixture timing " + json.dumps(row), flush=True)

          emulated = os.environ.get("REGISTRY_CI_EMULATED_ARM") == "true"
          with patch.object(subprocess, "run", timed_run):
              result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([DebianHttpAuditTest(method)]))
          ok = result.wasSuccessful() and result.testsRun == 1 and not result.skipped
          expected_stages = ["success", "missing", "corrupt", "redirect", "all-bad", "cache-fill", "cache-read"]
          graph = [c for c in calls if c["kind"] == "graph"]
          limits = [600 if emulated else 90] + [90] * 6
          limits_match = [c["stage"] for c in graph] == expected_stages and [c["timeout"] for c in graph] == limits
          server = [c for c in calls if c["kind"] != "graph"]
          limits_match &= [c["kind"] for c in server] == ["server_pid", "server_pid", "shutdown"] and all(c["timeout"] == 30 for c in server)
          receipt.write_text(json.dumps({"run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "workflow_sha": os.environ["GITHUB_SHA"], "candidate": candidate, "source_file_sha256": hashlib.sha256(Path("ci/tests/test_debian_http_audit.py").read_bytes()).hexdigest(), "method": method, "machine": platform.machine(), "emulated": emulated, "calls": calls, "tests": result.testsRun, "failures": len(result.failures), "errors": len(result.errors), "skips": len(result.skipped), "limits_match": limits_match, "passed": ok}, indent=2) + "\n")
          raise SystemExit(0 if ok and limits_match else 1)
          DIAGNOSTIC
          HTTP_AUDIT_ARGS=()
          if [[ "${HTTP_AUDIT_READY:-}" == success ]]; then
            HTTP_AUDIT_ARGS=(--http-audit-jar "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar")
          fi
          python3 ci/private_mirrors.py suite \
            --artifacts runner-ci-artifacts --private-dir "$RUNNER_TEMP/private-mirrors-unit" \
            --public-config ci/source_mirrors.cfg "${HTTP_AUDIT_ARGS[@]}" \
            -- python3 "$RUNNER_TEMP/time-http-method.py"
      - name: Give the runner access to the ARM guest test evidence
        if: ${{ always() && matrix.architecture == 'arm64' }}
        run: |
          if [[ -d runner-ci-artifacts ]]; then
            sudo -n chown -R "$(id -u):$(id -g)" runner-ci-artifacts
          fi
      - name: Check runner evidence for private mirror URLs
        id: privacy
        if: always()
        shell: bash
        env:
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          python3 ci/private_mirrors.py check-artifacts --artifacts "$GITHUB_WORKSPACE/runner-ci-artifacts"
      - name: Retain runner test results
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cold-http-audit-${{ matrix.architecture }}
          path: runner-ci-artifacts/
          if-no-files-found: error
          retention-days: 14
