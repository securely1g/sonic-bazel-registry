name: SWSS-common original tests on the job-local manager PR 92 executor
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        required: true
        options: [four, all]
permissions:
  contents: read
jobs:
  validate:
    name: Original SWSS-common ARM64 contract with manager PR 92 and original fixture execution
    uses: ./.github/workflows/registry-module.yml
    with:
      diagnostic_scope: ${{ inputs.scope }}
      module: sonic-swss-common
      version: 0.0.9-334389eae54afd1f4f5ee69f89c3a7ad2062ee61
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
