name: Registry 120 native cache validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry120-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cache:
    name: Registry 120 cache replay (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      BAZEL_ARCH: ${{ matrix.bazel_arch }}
      BAZEL_SHA: ${{ matrix.bazel_sha }}
    steps:
      - name: Install native validation tools
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
          [[ "$(dpkg --print-architecture)" == "$ARCHITECTURE" ]]
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl gdb git libxml2 libzstd-dev patch pkg-config python3 tar unzip xz-utils zlib1g-dev zstd
          curl --fail --location --retry 3 --output /tmp/bazel \
            "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${BAZEL_ARCH}"
          printf '%s  %s\n' "$BAZEL_SHA" /tmp/bazel | sha256sum --check --strict
          install -m 0755 /tmp/bazel /usr/local/bin/bazel
      - name: Check out temporary validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: validator
          persist-credentials: false
      - name: Check out immutable registry candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 01b7128186ec5fdb669477dc51fe4c1dc12dd4b5
          path: candidate
          persist-credentials: false
      - name: Seed and replay runtime tools through the registry
        run: |
          set -euo pipefail
          python3 validator/ci/validate_registry120_cache.py \
            --registry "$GITHUB_WORKSPACE/candidate" \
            --architecture "$ARCHITECTURE" \
            --work-dir "$RUNNER_TEMP/registry120-cache" \
            --artifacts "$GITHUB_WORKSPACE/cache-artifacts"
      - name: Archive cache validation evidence
        id: archive
        if: always()
        run: bash candidate/ci/archive_artifacts.sh "$GITHUB_WORKSPACE/cache-artifacts" "$RUNNER_TEMP/registry120-cache-evidence.tar"
      - name: Retain cache validation evidence
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry120-cache-${{ matrix.architecture }}
          path: ${{ runner.temp }}/registry120-cache-evidence.tar
          if-no-files-found: error
          retention-days: 14
