name: Measure the ARM64 Bazel HTTP test startup
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  http:
    name: Compare the original and updated tests on one emulated ARM64 worker
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 35
    env:
      PILOT_EMULATED_ARM: 'true'
      REGISTRY_CI_EMULATED_ARM: 'true'
      REGISTRY_CI_HTTP_AUDIT_FIXTURE_BAZEL: /usr/local/bin/bazel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Download the Java agent used by the failing PR job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13885188402'
          run-id: '43084315571'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/http-agent
          merge-multiple: true
      - name: Prepare the same ARM64 runner as the PR
        run: ci/pilot_arm.sh prepare
      - name: Prepare both test versions and a timer
        run: |
          set -euo pipefail
          git show 8b85e5bfa8970e656386c6ee08be501fee60e2fc:ci/tests/test_debian_http_audit.py > ci/tests/diagnostic_original.py
          git diff --exit-code 2dc5cf7ad0ff3ff417809435c6478c1a49114466 -- ci/tests/test_debian_http_audit.py
          cat > "$RUNNER_TEMP/time-http-case.py" <<'PY'
          import importlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          import unittest

          sys.path.insert(0, str(Path("ci/tests").resolve()))
          module = importlib.import_module(sys.argv[1])
          original_run = subprocess.run

          def timed_run(command, *args, **kwargs):
              if command[0] != os.environ["REGISTRY_CI_HTTP_AUDIT_FIXTURE_BAZEL"]:
                  return original_run(command, *args, **kwargs)
              action = next(x for x in command[1:] if not x.startswith("-"))
              source = Path(kwargs["cwd"]) / "extension.bzl"
              tail = source.read_text().splitlines()[-1] if source.exists() else ""
              phase = tail if tail.startswith("# ") else "setup"
              start = time.monotonic()
              try:
                  return original_run(command, *args, **kwargs)
              finally:
                  print(f"{action} {phase}: {time.monotonic()-start:.2f}s, limit {kwargs.get('timeout')}s", flush=True)

          subprocess.run = timed_run
          case = module.DebianHttpAuditTest("test_real_bazel_opaque_fallback_redirect_integrity_and_cache")
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([case]))
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Validate the updated test with a fresh Bazel workspace
        shell: bash ci/pilot_arm.sh shell {0}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          export REGISTRY_CI_HTTP_AUDIT_FIXTURE_JAR="$RUNNER_TEMP/http-agent/debian-http-audit.jar"
          test -f "$REGISTRY_CI_HTTP_AUDIT_FIXTURE_JAR"
          python3 -B "$RUNNER_TEMP/time-http-case.py" test_debian_http_audit
      - name: Measure the original test with another fresh workspace on the same worker
        if: ${{ !cancelled() }}
        shell: bash ci/pilot_arm.sh shell {0}
        run: |
          set -euo pipefail
          export REGISTRY_CI_HTTP_AUDIT_FIXTURE_JAR="$RUNNER_TEMP/http-agent/debian-http-audit.jar"
          python3 -B "$RUNNER_TEMP/time-http-case.py" diagnostic_original
