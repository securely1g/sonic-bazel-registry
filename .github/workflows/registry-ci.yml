name: Registry CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_versions:
        description: Test every configured historical version instead of only the latest
        type: boolean
        default: false
      private_mirror_probe:
        description: Verify private Debian mirror availability with fresh Bazel downloads
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan module validation
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      local_matrix: ${{ steps.plan.outputs.local_matrix }}
      has_local_jobs: ${{ steps.plan.outputs.has_local_jobs }}
      hosted_arm_matrix: ${{ steps.plan.outputs.hosted_arm_matrix }}
      has_hosted_arm_jobs: ${{ steps.plan.outputs.has_hosted_arm_jobs }}
      http_audit_artifact_id: ${{ steps.http_audit_upload.outputs.artifact-id }}
      mirror_config: ${{ steps.mirror_config.outputs.kind }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A pull request can run this workflow against a head with the older mirror helper.
      - name: Identify the checked-out mirror configuration
        id: mirror_config
        if: ${{ runner.environment == 'self-hosted' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && hashFiles('ci/private_mirrors.py') != '' }}
        run: echo "kind=${{ hashFiles('ci/debian_snapshots.json') != '' && 'roots' || 'dated' }}" >> "$GITHUB_OUTPUT"
      # The existing Trixie JDK includes jdk.compiler even without a javac CLI.
      # Optional compile/transfer failures cannot invalidate ordinary planning;
      # the mirror wrapper reports missing telemetry instead of claiming coverage.
      - name: Compile the maintained audit source once
        id: http_audit_build
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 ci/build_http_audit.py --output "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar"
      - name: Publish the same-run audit agent
        id: http_audit_upload
        if: steps.http_audit_build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-http-audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/debian-http-audit/debian-http-audit.jar
          if-no-files-found: error
          retention-days: 30
      - name: Select module versions
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL_VERSIONS: ${{ inputs.all_versions }}
        run: |
          set -euo pipefail
          POLICY_FLAGS=()
          if [[ "$EVENT_NAME" == push ]]; then
            # main already contains this push. Comparing with current main
            # would silently bless edits/deletions of published entries.
            PUBLISHED_SHA="$BEFORE_SHA"
            POLICY_FLAGS+=(--push)
          else
            # Use the maintained repository, including for forks and stacked
            # PRs. Anonymous public fetch needs no write token or credentials.
            git fetch --no-tags https://github.com/securely1g/sonic-bazel-registry.git \
              +refs/heads/main:refs/registry-ci/published-main
            PUBLISHED_SHA="$(git rev-parse refs/registry-ci/published-main)"
          fi
          printf 'Event: %s\nPublished baseline: %s\nPR base: %s\nHead: %s\n' \
            "$EVENT_NAME" "$PUBLISHED_SHA" "$BASE_SHA" "$HEAD_SHA" | tee plan.log
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --base "$BASE_SHA" --head "$HEAD_SHA" --output plan.json 2>&1 | tee -a plan.log
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$ALL_VERSIONS" == true ]]; then
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              --head "$HEAD_SHA" --all --output plan.json 2>&1 | tee -a plan.log
          else
            python3 ci/registry_ci.py plan --published "$PUBLISHED_SHA" \
              "${POLICY_FLAGS[@]}" --head "$HEAD_SHA" --latest --output plan.json 2>&1 | tee -a plan.log
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path("plan.json").read_text())
          routes = {("amd64", "amd64", False), ("arm64", "arm64", False), ("arm64", "amd64", True)}
          runners = {"amd64": ["self-hosted", "Linux", "X64", "debian-trixie-container"],
                     "arm64": ["ubuntu-24.04-arm"]}
          identities = set()
          for job in matrix["include"]:
              route = (job.get("architecture"), job.get("execution_architecture"), job.get("cross_compile"))
              if (type(job.get("cross_compile")) is not bool or route not in routes
                      or job.get("runner") != runners[job["execution_architecture"]]):
                  raise SystemExit("Unsupported execution route in validation plan")
              identity = (job["module"], job["version"], job["architecture"])
              if identity in identities:
                  raise SystemExit("Duplicate module validation job")
              identities.add(identity)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
              print("has_jobs=" + str(bool(matrix["include"])).lower(), file=output)
              for group, execution in (("local", "amd64"), ("hosted_arm", "arm64")):
                  selected = {"include": [job for job in matrix["include"]
                                          if job["execution_architecture"] == execution]}
                  print(group + "_matrix=" + json.dumps(selected, separators=(",", ":")), file=output)
                  print("has_" + group + "_jobs=" + str(bool(selected["include"])).lower(), file=output)
          PY
      - name: Retain validation plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-plan
          path: |
            plan.json
            plan.log
          if-no-files-found: warn
          retention-days: 14

  unit:
    name: Registry runner tests (${{ matrix.architecture }})
    needs: plan
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: [self-hosted, Linux, X64, debian-trixie-container]
            machine: x86_64
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            runner: [ubuntu-24.04-arm]
            machine: aarch64
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare APT repository tools
        shell: bash
        run: |
          bash ci/prepare_repository_tools.sh
      - name: Identify the checked-out mirror configuration
        id: mirror_config
        if: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && hashFiles('ci/private_mirrors.py') != '' }}
        run: echo "kind=${{ hashFiles('ci/debian_snapshots.json') != '' && 'roots' || 'dated' }}" >> "$GITHUB_OUTPUT"
      - name: Download the optional same-run HTTP audit agent
        id: http_audit_download
        if: ${{ needs.plan.outputs.http_audit_artifact_id != '' && contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.plan.outputs.http_audit_artifact_id }}
          path: ${{ runner.temp }}/debian-http-audit
          merge-multiple: true
      - name: Install Bazel for real runner integration tests
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          BAZEL_ARCH: ${{ matrix.bazel_arch }}
          BAZEL_SHA: ${{ matrix.bazel_sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
          if [[ "$BAZEL_ARCH" == x86_64 ]]; then
            printf '%s  %s\n' "$BAZEL_SHA" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
            # The image wrapper passes its Java CA store as a startup option,
            # including when tests use --ignore_all_rc_files.
            echo "REGISTRY_CI_TEST_BAZEL=/usr/local/bin/bazel" >> "$GITHUB_ENV"
          else
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/bazel-8.5.1" \
              "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${BAZEL_ARCH}"
            printf '%s  %s\n' "$BAZEL_SHA" "$RUNNER_TEMP/bazel-8.5.1" | sha256sum --check --strict
            chmod 0755 "$RUNNER_TEMP/bazel-8.5.1"
            echo "REGISTRY_CI_TEST_BAZEL=$RUNNER_TEMP/bazel-8.5.1" >> "$GITHUB_ENV"
          fi
      - name: Test planning and validation runner
        shell: bash
        env:
          REGISTRY_CI_TEST_ARTIFACTS: runner-ci-artifacts/runner-bazel-artifacts
          HTTP_AUDIT_READY: ${{ steps.http_audit_download.outcome }}
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          mkdir -p runner-ci-artifacts
          HTTP_AUDIT_ARGS=()
          if [[ "${HTTP_AUDIT_READY:-}" == success ]]; then
            HTTP_AUDIT_ARGS=(--http-audit-jar "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar")
          fi
          python3 ci/private_mirrors.py suite \
            --artifacts runner-ci-artifacts --private-dir "$RUNNER_TEMP/private-mirrors-unit" \
            --public-config ci/source_mirrors.cfg "${HTTP_AUDIT_ARGS[@]}" \
            -- python3 ci/run_runner_tests.py --suite native
      - name: Validate private Debian mirrors from the Trixie runner
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.private_mirror_probe && contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && github.actor != 'dependabot[bot]' }}
        shell: bash
        env:
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/runner-ci-artifacts/private-mirror-probe"
          python3 ci/private_mirrors.py probe \
            --artifacts "$GITHUB_WORKSPACE/runner-ci-artifacts/private-mirror-probe" \
            --private-dir "$RUNNER_TEMP/private-mirrors-unit" \
            --public-config ci/source_mirrors.cfg \
            --bazel /usr/local/bin/bazel
      - name: Check runner evidence for private mirror URLs
        id: privacy
        if: always()
        shell: bash
        env:
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          python3 ci/private_mirrors.py check-artifacts --artifacts "$GITHUB_WORKSPACE/runner-ci-artifacts"
      - name: Retain runner test results
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-runner-tests-${{ matrix.architecture }}
          path: runner-ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  cross_fixture:
    name: ARM cross compiler and runtime fixture
    needs: plan
    if: ${{ always() && !cancelled() }}
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 60
    env:
      REGISTRY_CI_TEST_BAZEL: /usr/local/bin/bazel
      REGISTRY_CI_TEST_ARM_EXECUTOR: /usr/local/bin/sonic-arm64
      REGISTRY_CI_TEST_ARTIFACTS: cross-fixture-artifacts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare APT repository tools
        shell: bash
        run: |
          bash ci/prepare_repository_tools.sh
      - name: Identify the checked-out mirror configuration
        id: mirror_config
        if: ${{ runner.environment == 'self-hosted' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && hashFiles('ci/private_mirrors.py') != '' }}
        run: echo "kind=${{ hashFiles('ci/debian_snapshots.json') != '' && 'roots' || 'dated' }}" >> "$GITHUB_OUTPUT"
      - name: Download the optional same-run HTTP audit agent
        id: http_audit_download
        if: ${{ needs.plan.outputs.http_audit_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.plan.outputs.http_audit_artifact_id }}
          path: ${{ runner.temp }}/debian-http-audit
          merge-multiple: true
      - name: Verify cross fixture prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          printf '%s  %s\n' 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
          [[ -x "$REGISTRY_CI_TEST_BAZEL" && -x "$REGISTRY_CI_TEST_ARM_EXECUTOR" ]]
      - name: Test the cross compiler and ARM runtime
        shell: bash
        env:
          HTTP_AUDIT_READY: ${{ steps.http_audit_download.outcome }}
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          HTTP_AUDIT_ARGS=()
          if [[ "${HTTP_AUDIT_READY:-}" == success ]]; then
            HTTP_AUDIT_ARGS=(--http-audit-jar "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar")
          fi
          python3 ci/private_mirrors.py suite \
            --artifacts cross-fixture-artifacts --private-dir "$RUNNER_TEMP/private-mirrors-cross" \
            --public-config ci/source_mirrors.cfg "${HTTP_AUDIT_ARGS[@]}" \
            -- python3 ci/run_runner_tests.py --suite cross
      - name: Check cross fixture evidence for private mirror URLs
        id: privacy
        if: always()
        env:
          DEBIAN_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
          DEBIAN_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_ROOT: ${{ steps.mirror_config.outputs.kind == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ steps.mirror_config.outputs.kind == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: python3 ci/private_mirrors.py check-artifacts --artifacts cross-fixture-artifacts
      - name: Retain cross fixture results
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-arm-cross-fixture
          path: cross-fixture-artifacts/
          if-no-files-found: warn
          retention-days: 14

  modules_local:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_local_jobs == 'true' }}
    strategy:
      fail-fast: false
      # One module budget per run covers native AMD64 and every ARM cross job.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.local_matrix) }}
    uses: ./.github/workflows/registry-module.yml
    with:
      module: ${{ matrix.module }}
      version: ${{ matrix.version }}
      architecture: ${{ matrix.architecture }}
      execution_architecture: ${{ matrix.execution_architecture }}
      cross_compile: ${{ matrix.cross_compile }}
      runner: ${{ toJSON(matrix.runner) }}
      http_audit_artifact_id: ${{ needs.plan.outputs.http_audit_artifact_id }}
    # Public/fork runs keep the existing download candidates without these secrets.
    secrets:
      DEBIAN_MIRROR_ROOT: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && needs.plan.outputs.mirror_config == 'roots' && secrets.DEBIAN_MIRROR_ROOT || '' }}
      DEBIAN_MIRROR_BASE_URL: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && needs.plan.outputs.mirror_config == 'dated' && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
      DEBIAN_SECURITY_MIRROR_ROOT: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && needs.plan.outputs.mirror_config == 'roots' && secrets.DEBIAN_SECURITY_MIRROR_ROOT || '' }}
      DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ contains(matrix.runner, 'self-hosted') && contains(matrix.runner, 'debian-trixie-container') && needs.plan.outputs.mirror_config == 'dated' && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}

  modules_hosted_arm:
    name: ${{ matrix.module }} ${{ matrix.version }} (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.has_hosted_arm_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hosted_arm_matrix) }}
    uses: ./.github/workflows/registry-module.yml
    with:
      module: ${{ matrix.module }}
      version: ${{ matrix.version }}
      architecture: ${{ matrix.architecture }}
      execution_architecture: ${{ matrix.execution_architecture }}
      cross_compile: ${{ matrix.cross_compile }}
      runner: ${{ toJSON(matrix.runner) }}

  required:
    name: Registry CI
    if: always()
    needs: [plan, unit, cross_fixture, modules_local, modules_hosted_arm]
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - name: Require successful planning, runner tests, and module validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CROSS_FIXTURE_RESULT: ${{ needs.cross_fixture.result }}
          LOCAL_RESULT: ${{ needs.modules_local.result }}
          HOSTED_ARM_RESULT: ${{ needs.modules_hosted_arm.result }}
          HAS_LOCAL_JOBS: ${{ needs.plan.outputs.has_local_jobs }}
          HAS_HOSTED_ARM_JOBS: ${{ needs.plan.outputs.has_hosted_arm_jobs }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success ]]
          [[ "$UNIT_RESULT" == success ]]
          [[ "$CROSS_FIXTURE_RESULT" == success ]]
          require_modules() {
            if [[ "$1" == true ]]; then
              [[ "$2" == success ]]
            else
              [[ "$1" == false && "$2" == skipped ]]
            fi
          }
          require_modules "$HAS_LOCAL_JOBS" "$LOCAL_RESULT"
          require_modules "$HAS_HOSTED_ARM_JOBS" "$HOSTED_ARM_RESULT"
