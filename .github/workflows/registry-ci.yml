name: Validate SymCrypt target binutils during the FIPS ARM cross-build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-fips
      version: 0.0.4-symcrypt-cross.1
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
