name: Validate ARM64 build infrastructure tests on the registry fork
on: workflow_dispatch
permissions:
  contents: read
jobs:
  arm64:
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-build-infra
      version: 0.0.45-77ef625a4ddafc8cdc15f3cc6aee31eabac8a5de
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
