name: Pinned Debian ARM module validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-download-sonic-dash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  module_arm64:
    name: sonic-dash 0.0.2-5c9305403585a7ae54f86918219acb8ed39f740a (ARM64 cross, full 4-build/1-test contract)
    uses: ./.github/workflows/registry-module.yml
    with:
      module: sonic-dash
      version: 0.0.2-5c9305403585a7ae54f86918219acb8ed39f740a
      architecture: arm64
      execution_architecture: amd64
      cross_compile: true
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
