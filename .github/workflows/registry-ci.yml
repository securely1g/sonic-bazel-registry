name: Validate cold Debian inputs across the migration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.module }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {module: gawk, version: "5.3.2.sonic.1", arch: arm64}
          - {module: libpsample, version: "1.1.0.sonic.1", arch: amd64}
          - {module: libnl3, version: "3.7.0.sonic.7", arch: arm64}
    uses: ./.github/workflows/registry-module.yml
    with:
      module: ${{ matrix.module }}
      version: ${{ matrix.version }}
      architecture: ${{ matrix.arch }}
      execution_architecture: amd64
      cross_compile: ${{ matrix.arch == 'arm64' }}
      runner: '["self-hosted","Linux","X64","debian-trixie-container"]'
