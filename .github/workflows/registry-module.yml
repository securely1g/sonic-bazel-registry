name: Registry module validation

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      version:
        required: true
        type: string
      architecture:
        required: true
        type: string
      execution_architecture:
        description: Native host architecture; defaults to the target for native callers
        type: string
        default: ''
      cross_compile:
        type: boolean
        default: false
      runner:
        description: JSON array of runner labels from the validated plan
        required: true
        type: string
      http_audit_artifact_id:
        description: Optional audit agent artifact produced from this source in the same workflow run
        type: string
        default: ''
    secrets:
      DEBIAN_MIRROR_BASE_URL:
        description: Optional private mirror for the pinned Debian snapshot
        required: false
      DEBIAN_SECURITY_MIRROR_BASE_URL:
        description: Optional private mirror for the pinned Debian security snapshot
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate module
    runs-on: ${{ fromJSON(inputs.runner) }}
    # Allow time for cold serial SWSS builds and the FIPS vendor suites under emulation.
    timeout-minutes: >-
      ${{ inputs.cross_compile && inputs.module == 'sonic-swss' && inputs.version == '0.0.3-42df8c74af53427be97609a7b11e9aec59d2d454' && 360 ||
          inputs.cross_compile && inputs.module == 'sonic-fips' && inputs.version == '0.0.6-1ea828e13ac9c62d2007dbbf2ef3d72417e3d009' && 240 ||
          180 }}
    # Local native/cross jobs execute directly in the fresh Trixie runner.
    # Only native hosted ARM needs the separate pinned job image.
    container: ${{ inputs.architecture == 'arm64' && !inputs.cross_compile && 'debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c' || '' }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_MODULE: ${{ inputs.module }}
      CI_VERSION: ${{ inputs.version }}
      CI_ARCHITECTURE: ${{ inputs.architecture }}
      CI_EXECUTION_ARCHITECTURE: ${{ inputs.execution_architecture || inputs.architecture }}
      CI_CROSS_COMPILE: ${{ inputs.cross_compile }}
      ARM_TEST_EXECUTOR: /usr/local/bin/sonic-arm64
      TEST_CONTAINER_IMAGE: ${{ inputs.architecture == 'arm64' && !inputs.cross_compile && 'debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c' || '' }}
    steps:
      - name: Validate execution route
        run: |
          set -euo pipefail
          case "$CI_ARCHITECTURE:$CI_EXECUTION_ARCHITECTURE:$CI_CROSS_COMPILE:$(uname -m)" in
            amd64:amd64:false:x86_64|arm64:arm64:false:aarch64|arm64:amd64:true:x86_64) ;;
            *) echo "Unsupported target/native execution route" >&2; exit 1 ;;
          esac
          if [[ "$CI_CROSS_COMPILE" == true ]]; then
            [[ -x "$ARM_TEST_EXECUTOR" ]] || { echo "Missing ARM test executor" >&2; exit 1; }
          fi
      - name: Install build and package test tools
        if: inputs.architecture == 'arm64' && !inputs.cross_compile
        run: |
          set -euo pipefail
          apt-get update
          # LLVM needs libxml2; installed SDK tests exercise their pkg-config metadata.
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl gdb git libxml2 libzstd-dev patch pkg-config python3 tar unzip xz-utils zlib1g-dev zstd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the optional same-run HTTP audit agent
        id: http_audit_download
        if: ${{ inputs.http_audit_artifact_id != '' && contains(fromJSON(inputs.runner), 'self-hosted') && contains(fromJSON(inputs.runner), 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.http_audit_artifact_id }}
          path: ${{ runner.temp }}/debian-http-audit
          merge-multiple: true
      - name: Prepare a Debian ARM kernel for the Linux AIO test
        if: inputs.cross_compile && inputs.module == 'rules_distroless'
        run: |
          sudo -n apt-get -q update
          sudo -n apt-get -q -y --no-install-recommends install qemu-system-arm cpio
          bundle="$RUNNER_TEMP/arm-kernel"
          ci/arm_kernel_test/prepare.sh "$bundle"
          echo "ARM_TEST_EXECUTOR=$bundle/executor" >> "$GITHUB_ENV"
      - name: Install Bazel 8.5.1
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              [[ "$CI_EXECUTION_ARCHITECTURE" == amd64 ]]
              bazel_arch=x86_64
              bazel_sha=61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
              ;;
            aarch64)
              [[ "$CI_EXECUTION_ARCHITECTURE" == arm64 ]]
              bazel_arch=arm64
              bazel_sha=b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
              ;;
            *) echo "Unsupported native architecture" >&2; exit 1 ;;
          esac
          if [[ "$CI_EXECUTION_ARCHITECTURE" == amd64 ]]; then
            printf '%s  %s\n' "$bazel_sha" /usr/local/lib/bazel-8.5.1 | sha256sum --check --strict
          else
            curl --fail --location --retry 3 --output /tmp/bazel "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${bazel_arch}"
            printf '%s  %s\n' "$bazel_sha" /tmp/bazel | sha256sum --check --strict
            install -m 0755 /tmp/bazel /usr/local/bin/bazel
          fi
      - name: Build and test through the registry
        env:
          HTTP_AUDIT_READY: ${{ steps.http_audit_download.outcome }}
          DEBIAN_MIRROR_BASE_URL: ${{ contains(fromJSON(inputs.runner), 'self-hosted') && contains(fromJSON(inputs.runner), 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ contains(fromJSON(inputs.runner), 'self-hosted') && contains(fromJSON(inputs.runner), 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          ROOT=()
          SECRET_ENV=()
          BAZEL_STARTUP_ARGS=()
          BAZEL_BUILD_ARGS=()
          CROSS_ARGS=()
          HTTP_AUDIT_ARGS=()
          if [[ "${HTTP_AUDIT_READY:-}" == success ]]; then
            HTTP_AUDIT_ARGS=(--http-audit-jar "$RUNNER_TEMP/debian-http-audit/debian-http-audit.jar")
          fi
          if [[ "$CI_EXECUTION_ARCHITECTURE" == amd64 ]]; then
            TEST_CONTAINER_IMAGE="${SONIC_RUNNER_IMAGE_REFERENCE:?Missing runner image identity}"
            ROOT=(sudo -n)
            SECRET_ENV=(--preserve-env=DEBIAN_MIRROR_BASE_URL,DEBIAN_SECURITY_MIRROR_BASE_URL,GITHUB_ACTIONS)
            # Bazel's default heap is too small for large dependency graphs
            # inside the runner's 16 GiB memory limit.
            BAZEL_STARTUP_ARGS=(--bazel-startup-arg=--host_jvm_args=-Xmx2g)
            BAZEL_BUILD_ARGS=(--bazel-build-arg=--jobs=1 --bazel-build-arg=--discard_analysis_cache)
            "${ROOT[@]}" git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          if [[ "$CI_CROSS_COMPILE" == true ]]; then
            CROSS_ARGS=(--cross-compile --test-executor "$ARM_TEST_EXECUTOR")
          fi
          if [[ "$CI_ARCHITECTURE" == amd64 && "$CI_MODULE" == libteam && "$CI_VERSION" == 1.31.0.sonic.1 ]]; then
            # Reuse the exact APE inputs whose original endpoints failed in
            # libteam CI. Keep this outside the runner's fresh work directory.
            "${ROOT[@]}" python3 ci/prepare_cosmos_distdir.py \
              --distdir "$RUNNER_TEMP/registry-cosmos-distdir" \
              --cache-dir "$RUNNER_TEMP/registry-cosmos-downloads" \
              --receipt "$GITHUB_WORKSPACE/ci-artifacts/cosmos-distdir.json"
            BAZEL_BUILD_ARGS+=("--bazel-build-arg=--distdir=$RUNNER_TEMP/registry-cosmos-distdir")
          fi
          "${ROOT[@]}" "${SECRET_ENV[@]}" python3 ci/private_mirrors.py run \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts" \
            --private-dir "$RUNNER_TEMP/private-mirrors-module" \
            --public-config ci/source_mirrors.cfg \
            "${HTTP_AUDIT_ARGS[@]}" \
            -- python3 ci/registry_ci.py run \
            --module "$CI_MODULE" \
            --version "$CI_VERSION" \
            --architecture "$CI_ARCHITECTURE" \
            --bazel /usr/local/bin/bazel \
            "${BAZEL_STARTUP_ARGS[@]}" \
            "${BAZEL_BUILD_ARGS[@]}" \
            "${CROSS_ARGS[@]}" \
            --work-dir "$RUNNER_TEMP/registry-ci" \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts" \
            --test-container-image "$TEST_CONTAINER_IMAGE"
      - name: Archive module validation results
        id: archive
        if: always()
        env:
          DEBIAN_MIRROR_BASE_URL: ${{ contains(fromJSON(inputs.runner), 'self-hosted') && contains(fromJSON(inputs.runner), 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.DEBIAN_MIRROR_BASE_URL || '' }}
          DEBIAN_SECURITY_MIRROR_BASE_URL: ${{ contains(fromJSON(inputs.runner), 'self-hosted') && contains(fromJSON(inputs.runner), 'debian-trixie-container') && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.DEBIAN_SECURITY_MIRROR_BASE_URL || '' }}
        run: |
          set -euo pipefail
          ROOT=()
          SECRET_ENV=()
          if [[ "$CI_EXECUTION_ARCHITECTURE" == amd64 ]]; then
            ROOT=(sudo -n)
            SECRET_ENV=(--preserve-env=DEBIAN_MIRROR_BASE_URL,DEBIAN_SECURITY_MIRROR_BASE_URL,GITHUB_ACTIONS)
          fi
          archive="$RUNNER_TEMP/registry-ci-evidence.tar"
          "${ROOT[@]}" "${SECRET_ENV[@]}" python3 ci/private_mirrors.py check-artifacts \
            --artifacts "$GITHUB_WORKSPACE/ci-artifacts"
          "${ROOT[@]}" bash ci/archive_artifacts.sh "$GITHUB_WORKSPACE/ci-artifacts" "$archive"
          if [[ -f "$archive" && "$CI_EXECUTION_ARCHITECTURE" == amd64 ]]; then
            # Keep permissions inside the TAR intact while letting the
            # non-root upload action read the root-created archive.
            sudo -n chown "$(id -u):$(id -g)" "$archive"
          fi
      - name: Retain module validation results
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-ci-${{ inputs.module }}-${{ inputs.version }}-${{ inputs.architecture }}
          path: ${{ runner.temp }}/registry-ci-evidence.tar
          if-no-files-found: warn
          retention-days: 14
