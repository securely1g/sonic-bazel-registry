name: Registry module validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-probe:
    name: Probe worker download routes
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - name: Compare configured proxy with direct public downloads
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from urllib.parse import urlsplit
          urls = [
              'https://github.com/bazel-contrib/rules_python/releases/download/1.9.0/rules_python-1.9.0.tar.gz',
              'https://deb.debian.org/debian/pool/main/k/kdump-tools/kdump-tools_1.10.7.tar.xz',
              'https://files.pythonhosted.org/packages/e2/03/f3c8ba0a6b6e30d7d18c40faab90807c9bb5e9a1e3b2fe2008af624a9c97/build-1.2.1-py3-none-any.whl',
              'https://pypi.org/simple/python-debian/',
          ]
          direct_ok = True
          for url in urls:
              for route in ['proxy', 'direct']:
                  environment = dict(os.environ)
                  environment['no_proxy'] = environment['NO_PROXY'] = '' if route == 'proxy' else '*'
                  if route == 'direct':
                      for key in ['http_proxy', 'https_proxy', 'HTTP_PROXY', 'HTTPS_PROXY', 'all_proxy', 'ALL_PROXY']:
                          environment.pop(key, None)
                  command = ['curl', '--disable', '--fail', '--location', '--silent', '--show-error',
                             '--connect-timeout', '5', '--max-time', '15', '--range', '0-0',
                             '--output', '/dev/null', '--write-out', '%{http_code}\n%{url_effective}', url]
                  result = subprocess.run(command, env=environment, text=True, capture_output=True)
                  fields = result.stdout.splitlines()
                  record = dict(route=route, host=urlsplit(url).hostname, returncode=result.returncode,
                                http_status=fields[0] if fields else '',
                                final_host=urlsplit(fields[1]).hostname if len(fields)>1 else '',
                                error=result.stderr[:300])
                  print(json.dumps(record), flush=True)
                  if route == 'direct' and result.returncode:
                      direct_ok = False
          raise SystemExit(0 if direct_ok else 1)
          PY
