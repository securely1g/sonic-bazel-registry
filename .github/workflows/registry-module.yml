name: Registry module validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-probe:
    name: Probe pinned Salsa downloads
    runs-on: [self-hosted, Linux, X64, debian-trixie-container]
    timeout-minutes: 5
    steps:
      - name: Compare proxy and direct routes with original checksums
        shell: bash
        run: |
          python3 - <<'PY_PROBE'
          import hashlib, json, os, pathlib, socket, subprocess, tempfile
          archives = [('https://salsa.debian.org/ssh-team/openssh/-/archive/53e29c05c14ec5f29dbd3df5466b55cf4ca488b1/openssh-53e29c05c14ec5f29dbd3df5466b55cf4ca488b1.tar.gz', 'c9124c499d92034c2413f0917949272b182e059951a37ca0c18831f59aab44b6'), ('https://salsa.debian.org/debian/krb5/-/archive/d26e8df8ee220af0f2361a66d2d357762aff1c3e/krb5-d26e8df8ee220af0f2361a66d2d357762aff1c3e.tar.gz', '4a0db8cff8e4fc9adb4f242920302eca0a92db7e1a7479dd1ca17f45c710e3b7'), ('https://salsa.debian.org/cpython-team/python3/-/archive/942fbb14f3ee7e2c3cb416767229bbc25aaba79d/python3-942fbb14f3ee7e2c3cb416767229bbc25aaba79d.tar.gz', 'd8d93eb5ea0cda15161b39a71d39f071f5fcfa0a8875473852833867f2fca1cc'), ('https://salsa.debian.org/go-team/compiler/golang/-/archive/9972a7f298dfca34b1bf0463121664998b8959b4/golang-9972a7f298dfca34b1bf0463121664998b8959b4.tar.gz', '860d10312d714f0a13626e433398d1c8cc2ab0f57073cc87cf9c9edc2188fa35')]
          print(json.dumps({"salsa_addresses": sorted({v[4][0] for v in socket.getaddrinfo("salsa.debian.org",443,type=socket.SOCK_STREAM)})}), flush=True)
          with tempfile.TemporaryDirectory(prefix="salsa-probe-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              directory = pathlib.Path(temporary)
              for index, (url, expected) in enumerate(archives):
                  for route in ["proxy", "direct"]:
                      environment = dict(os.environ)
                      environment["no_proxy"] = environment["NO_PROXY"] = "" if route == "proxy" else "*"
                      if route == "direct":
                          for key in ["http_proxy","https_proxy","HTTP_PROXY","HTTPS_PROXY","all_proxy","ALL_PROXY"]:
                              environment.pop(key, None)
                      output = directory / f"{index}-{route}.tar.gz"
                      result = subprocess.run(["curl","--disable","--fail","--location","--silent","--show-error",
                          "--connect-timeout","5","--max-time","20","--output",str(output),
                          "--write-out","%{http_code} %{remote_ip} %{size_download}",url],
                          env=environment,text=True,capture_output=True)
                      digest = hashlib.sha256(output.read_bytes()).hexdigest() if output.exists() else None
                      print(json.dumps(dict(archive=url,route=route,returncode=result.returncode,
                          response=result.stdout,sha256=digest,sha256_matches=digest==expected,error=result.stderr[:400])),flush=True)
              url, expected = archives[2]
              (directory / "WORKSPACE.bazel").write_text('workspace(name="salsa_probe")\nload("//:probe.bzl", "probe")\nprobe(name="archive")\n')
              (directory / "BUILD.bazel").write_text("")
              (directory / "probe.bzl").write_text('def _impl(ctx):\n    ctx.download(url='+repr(url)+', output="archive.tar.gz", sha256='+repr(expected)+', canonical_id="worker-salsa-probe-20261123")\n    ctx.file("BUILD.bazel", "")\nprobe=repository_rule(implementation=_impl)\n')
              command=["sudo","-n","env","-u","http_proxy","-u","https_proxy","-u","HTTP_PROXY","-u","HTTPS_PROXY","-u","all_proxy","-u","ALL_PROXY","/usr/local/bin/bazel","--output_base="+str(directory/"bazel-output"),"fetch","--enable_workspace","--noenable_bzlmod","@archive//...","--http_connector_attempts=1","--http_timeout_scaling=0.1"]
              try:
                  result=subprocess.run(command,cwd=directory,text=True,capture_output=True,timeout=60)
                  print(result.stdout,flush=True);print(result.stderr,flush=True)
                  print(json.dumps({"bazel_direct_exit":result.returncode}),flush=True)
              except subprocess.TimeoutExpired:
                  print(json.dumps({"bazel_direct_status":"timeout_60s"}),flush=True)
          PY_PROBE
